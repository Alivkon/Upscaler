services:
  upscaler:
    build: .
    container_name: upscaler
    restart: unless-stopped
    # Секреты — только в `.env` на машине; в этот файл они не попадают,
    # он лежит в git.
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SITE_ORIGIN: https://tessarum.com
      # Перед контейнером стоит Traefik, и без этой строки `req.ip` — адрес
      # прокси: все посетители попадают в одно ведро счётчика, и десятый
      # за сутки получает отказ из-за девяти чужих вызовов. Ровно один прокси,
      # поэтому `1`, а не `true` наугад.
      TRUST_PROXY: 1
    # Потолок памяти. Машина общая: на ней двенадцать контейнеров, из них три
    # базы и четыре чужих бота, и своп выключен — значит промах по памяти тут
    # не тормозит, а убивает, и выбирает жертву ядро, по размеру. Увеличение
    # с 12.09 держит разом три сырых кадра ×4 (пересадка тона в `upscaler.js`),
    # и на самом тяжёлом входе, какой пропускают потолки эндпоинта, это около
    # гигабайта на вызов. Три здесь — это два одновременных вызова с запасом:
    # больше двух наверх всё равно не уходит (`max_containers=2` у Modal).
    # Смысл потолка не в экономии, а в том, чтобы наш всплеск убивал нас,
    # а не соседскую базу; `restart: unless-stopped` поднимет обратно.
    mem_limit: 3g
    # Коллекция живёт на машине, а не в образе: картинки приезжают по rsync
    # и переживают пересборку.
    volumes:
      - ./images:/app/images
      # Журнал запросов. Том, а не каталог образа: журнал — единственная память
      # сайта о том, кто приходил, и пересборка не должна её стирать
      # (`journal.js`, DEPLOYMENT.md). Внутри лежат сутки на файл и полгода
      # в сумме; чистит их сам сервер.
      - ./log:/app/log
    # Сеть Traefik. Порт 3000 наружу не публикуется — снаружи в контейнер
    # ходит только он, по имени `upscaler`.
    networks:
      - n8n_default
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  n8n_default:
    external: true
